<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF"/>
      <stop offset="100%" style="stop-color:#5856D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>

  <!-- Note icon -->
  <g fill="white">
    <!-- Paper -->
    <path d="M140 100 h180 l92 92 v220 c0 22-18 40-40 40 H140 c-22 0-40-18-40-40 V140 c0-22 18-40 40-40z"/>

    <!-- Folded corner -->
    <path d="M320 100 v52 c0 22 18 40 40 40 h52" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>

    <!-- Lines -->
    <rect x="140" y="220" width="160" height="16" rx="8" fill="#007AFF"/>
    <rect x="140" y="260" width="200" height="16" rx="8" fill="#007AFF" opacity="0.6"/>
    <rect x="140" y="300" width="120" height="16" rx="8" fill="#007AFF" opacity="0.4"/>

    <!-- Microphone icon -->
    <circle cx="380" cy="380" r="60" fill="#FF3B30"/>
    <path d="M380 350 c-11 0-20 9-20 20 v20 c0 11 9 20 20 20 s20-9 20-20 v-20 c0-11-9-20-20-20z" fill="white"/>
    <path d="M410 385 c0 17-13 30-30 30 s-30-13-30-30" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="380" y1="415" x2="380" y2="430" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
