<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .icons { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .icon-item { background: white; padding: 20px; border-radius: 12px; text-align: center; }
        canvas { display: block; margin: 0 auto 10px; }
        button { padding: 8px 16px; background: #007AFF; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .instructions { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Voice Notes - Icon Generator</h1>

    <div class="instructions">
        <h3>Anleitung:</h3>
        <ol>
            <li>Klicke auf "Download" bei jeder Größe</li>
            <li>Speichere die PNG-Dateien im <code>icons/</code> Ordner</li>
            <li>Benenne sie entsprechend (z.B. icon-192.png)</li>
        </ol>
    </div>

    <div class="icons" id="icons"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 512;

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#007AFF');
            gradient.addColorStop(1, '#5856D6');

            // Rounded rect background
            ctx.beginPath();
            const radius = 110 * scale;
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Paper
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.roundRect(100 * scale, 80 * scale, 232 * scale, 352 * scale, 20 * scale);
            ctx.fill();

            // Lines
            ctx.fillStyle = '#007AFF';
            ctx.fillRect(140 * scale, 200 * scale, 160 * scale, 16 * scale);
            ctx.globalAlpha = 0.6;
            ctx.fillRect(140 * scale, 240 * scale, 200 * scale, 16 * scale);
            ctx.globalAlpha = 0.4;
            ctx.fillRect(140 * scale, 280 * scale, 120 * scale, 16 * scale);
            ctx.globalAlpha = 1;

            // Mic circle
            ctx.beginPath();
            ctx.arc(360 * scale, 360 * scale, 60 * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#FF3B30';
            ctx.fill();

            // Mic icon
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.roundRect(345 * scale, 330 * scale, 30 * scale, 50 * scale, 15 * scale);
            ctx.fill();

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 6 * scale;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(360 * scale, 365 * scale, 25 * scale, 0, Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(360 * scale, 390 * scale);
            ctx.lineTo(360 * scale, 405 * scale);
            ctx.stroke();
        }

        const container = document.getElementById('icons');

        sizes.forEach(size => {
            const div = document.createElement('div');
            div.className = 'icon-item';

            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = Math.min(size, 150) + 'px';
            canvas.style.height = Math.min(size, 150) + 'px';

            drawIcon(canvas, size);

            const label = document.createElement('div');
            label.textContent = `${size}x${size}`;

            const button = document.createElement('button');
            button.textContent = 'Download';
            button.onclick = () => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            div.appendChild(canvas);
            div.appendChild(label);
            div.appendChild(button);
            container.appendChild(div);
        });
    </script>
</body>
</html>
